framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 10000
            failed: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'
        routing:
            Gsoi\Skeleton\Application\Command\ModerateComment\ModerateCommentCommand: async
