name: comment-moderation

x-app-build: &app-build
    context: .
    target: app

x-app-environment: &app-environment
    APP_ENV: prod
    APP_DEBUG: '0'
    APP_SECRET: '${APP_SECRET:?Set APP_SECRET in .env.docker}'
    DATABASE_URL: 'sqlite:////app/var/data.db'
    MESSENGER_TRANSPORT_DSN: 'doctrine://default?queue_name=moderation'
    MESSENGER_FAILED_TRANSPORT_DSN: 'doctrine://default?queue_name=failed'
    JWT_SECRET_KEY: /app/config/jwt/private.pem
    JWT_PUBLIC_KEY: /app/config/jwt/public.pem
    JWT_PASSPHRASE: '${JWT_PASSPHRASE:-}'
    MODERATION_LLM_BASE_URL: '${MODERATION_LLM_BASE_URL-http://ollama:11434/v1}'
    MODERATION_LLM_MODEL: '${MODERATION_LLM_MODEL-llama3.2}'
    MODERATION_LLM_API_KEY: '${MODERATION_LLM_API_KEY-}'
    MODERATION_LLM_TIMEOUT: '${MODERATION_LLM_TIMEOUT-10}'
    FACEBOOK_WEBHOOK_VERIFY_TOKEN: '${FACEBOOK_WEBHOOK_VERIFY_TOKEN:-}'
    FACEBOOK_APP_SECRET: '${FACEBOOK_APP_SECRET:-}'

x-app-volumes: &app-volumes
    - app-data:/app/var
    - jwt-data:/app/config/jwt

services:
    init:
        build: *app-build
        image: 'comment-moderation-app:${IMAGE_TAG:-local}'
        command: ['/usr/local/bin/app-init']
        environment: *app-environment
        restart: 'no'
        volumes: *app-volumes

    php:
        build: *app-build
        image: 'comment-moderation-app:${IMAGE_TAG:-local}'
        depends_on:
            init:
                condition: service_completed_successfully
        environment: *app-environment
        healthcheck:
            test: ['CMD', 'php', '-r', 'exit(@fsockopen("127.0.0.1", 9000) ? 0 : 1);']
            interval: 5s
            timeout: 3s
            retries: 12
        restart: unless-stopped
        volumes: *app-volumes

    token:
        profiles: [tools]
        build:
            context: .
            target: app-dev
        image: 'comment-moderation-app-dev:${IMAGE_TAG:-local}'
        entrypoint: ['php', 'bin/console', 'app:jwt:issue-moderator']
        command: ['--subject=docker-operator']
        depends_on:
            init:
                condition: service_completed_successfully
        environment:
            <<: *app-environment
            APP_ENV: dev
        restart: 'no'
        volumes: *app-volumes

    web:
        build:
            context: .
            target: web
        image: 'comment-moderation-web:${IMAGE_TAG:-local}'
        depends_on:
            php:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
            interval: 5s
            timeout: 3s
            retries: 12
        ports:
            - '127.0.0.1:${API_PORT:-8000}:8080'
        restart: unless-stopped

    ollama:
        image: '${OLLAMA_IMAGE:-ollama/ollama:latest}'
        healthcheck:
            test: ['CMD', 'ollama', 'list']
            interval: 5s
            timeout: 5s
            retries: 24
        ports:
            - '127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434'
        restart: unless-stopped
        volumes:
            - ollama-data:/root/.ollama

    ollama-init:
        image: '${OLLAMA_IMAGE:-ollama/ollama:latest}'
        command: ['pull', '${MODERATION_LLM_MODEL-llama3.2}']
        depends_on:
            ollama:
                condition: service_healthy
        network_mode: service:ollama
        restart: 'no'
        volumes:
            - ollama-data:/root/.ollama

    worker:
        build: *app-build
        image: 'comment-moderation-app:${IMAGE_TAG:-local}'
        command: ['php', 'bin/console', 'messenger:consume', 'async', '--time-limit=3600', '--memory-limit=256M', '-vv']
        depends_on:
            init:
                condition: service_completed_successfully
            ollama-init:
                condition: service_completed_successfully
        environment: *app-environment
        restart: unless-stopped
        volumes: *app-volumes

volumes:
    app-data:
    jwt-data:
    ollama-data:
